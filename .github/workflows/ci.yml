name: ci

# PR / branch CI: vendor-syntax + runtime smoke (required on main).
# Publishing is tag-gated in release.yml (no second smoke there).
# pull_request covers PR branches; push:main covers post-merge. Tags publish via release.yml.
on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast gate: catch unresolved conflict markers, unparseable vendored Python,
  # and shell-syntax errors in the docker init/s6 scripts in seconds, instead of
  # as a 60s health-timeout in the smoke build. The vendored webui and vault
  # plugin ship in the image and crash-loop if they won't import; a broken
  # cont-init/s6 script wedges startup the same way.
  vendor-syntax:
    name: vendor syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: No unresolved conflict markers in vendor/
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- vendor/; then
            echo "::error::unresolved git conflict markers in vendor/"
            exit 1
          fi

      - name: Byte-compile vendored webui and vault
        run: python -m compileall -q vendor/hermes-webui vendor/hermes-vault

      - name: Shell-syntax check docker init/s6 scripts
        run: |
          set -euo pipefail
          fail=0
          for f in docker/cont-init.d/* docker/s6-rc.d/*/run docker/s6-rc.d/*/finish; do
            [ -f "$f" ] || continue
            if ! dash -n "$f"; then
              echo "::error file=${f}::dash -n failed"
              fail=1
            fi
          done
          exit "$fail"

  smoke:
    name: smoke
    needs: [vendor-syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Runtime smoke (build + health + admin + restart)
        run: ./scripts/smoke.sh
