name: Sync Upstreams

# Pin-only. Nothing in this repo is a subtree anymore.
# Hermes image pin: check-upstream.yml.
# WebUI: when a newer non-exp tag exists, write webui-base + webui-sha.
# The image fetches that commit at build time. Vault is not synced.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read pinned refs from VERSION
        id: version
        run: ./scripts/read-version.sh >> "$GITHUB_OUTPUT"

      - name: Advance webui pin when a newer stable tag exists
        run: |
          set -euo pipefail
          pinned="${{ steps.version.outputs.webui_base }}"
          latest="$(git ls-remote --tags https://github.com/nesquena/hermes-webui.git \
            | sed 's#.*refs/tags/##' | grep -v '\^{}' | grep -v '^exp-' | sort -V | tail -1)"
          echo "webui pinned=${pinned:-<unset>} latest-stable=${latest}"
          if [ -z "$latest" ] || [ "$latest" = "$pinned" ]; then
            echo "No newer stable webui tag."
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "${pinned:-}" "$latest" | sort -V | tail -1)" != "$latest" ]; then
            echo "Latest stable tag does not sort after the pin — skipping."
            exit 0
          fi
          . scripts/version-lib.sh
          pin_webui_base "$latest"
          ./scripts/sync-upstreams.sh
          git add VERSION
          git commit -m "chore(sync): pin webui-base to ${latest}"

      - name: Open / update sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="automation/sync-upstreams"
          if git diff --quiet origin/main --; then
            echo "No changes vs main — nothing to sync."
            exit 0
          fi
          git push -f origin "HEAD:${branch}"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null || true)" = "OPEN" ]; then
            echo "Sync PR already open; branch updated."
          else
            gh pr create --base main --head "$branch" \
              --title "chore(sync): webui pin refresh" \
              --body "Automated webui pin refresh. Review before merge. The image fetches \`webui-sha\` at build time. Hermes pins stay with check-upstream.yml. Vault is not part of this image."
          fi
